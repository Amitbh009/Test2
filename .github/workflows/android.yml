name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest
    
    # Using a GitHub Environment allows setting up "Required Reviewers" 
    # so that the build triggers on push but waits for your manual approval in the UI.
    environment: BuildApproval

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # If gradlew wrapper isn't checked into git, gradle commands can be run directly
      continue-on-error: true

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Run Unit Tests
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew testDebugUnitTest
        else
          gradle testDebugUnitTest
        fi
