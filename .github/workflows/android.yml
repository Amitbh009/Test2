name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest
    
    # NOTE: Using a GitHub Environment requires "Required Reviewers" to be configured.
    # CRITICAL: On FREE GitHub accounts, Environments are ONLY available for PUBLIC repositories.
    # If this is a private repository on a free tier, this line will cause an error on GitHub Actions.
    # To resolve that, simply delete or comment out the line below.
    environment: BuildApproval

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Copy Env Configuration
      # Ensures the Secrets Gradle Plugin has a non-empty .env properties file to satisfy configurations
      run: cp .env.example .env

    - name: Prepare Debug Keystore
      # Prepares the keystore at root level as configured in app/build.gradle.kts
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Decoding debug.keystore from checked-in base64 resource..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "No base64 keystore found, generating self-signed fallback debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Make Gradle exec
      # Standardizes execution permissions of the wrapper for Linux runners
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

