name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest
    
    # Using a GitHub Environment allows setting up "Required Reviewers" 
    # so that the build triggers on push but waits for your manual approval in the UI.
    environment: BuildApproval

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11' # Explicit Gradle version supporting Java 21 and AGP 9.1.x

    - name: Prepare Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Decoding debug.keystore from checked-in base64 resource..."
          base64 -d debug.keystore.base64 > debug.keystore
        else
          echo "No base64 keystore found, generating self-signed fallback debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Run Unit Tests
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew testDebugUnitTest
        else
          gradle testDebugUnitTest
        fi

